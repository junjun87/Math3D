<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Math3D — 立体几何交互解题</title>
    <style>
        /* ===== Design Tokens ===== */
        :root {
            /* Primary — blue */
            --p50: #eff6ff;  --p100: #dbeafe; --p200: #bfdbfe; --p300: #93c5fd;
            --p400: #60a5fa; --p500: #3b82f6; --p600: #2563eb; --p700: #1d4ed8;
            --p800: #1e40af; --p900: #1e3a8a;
            /* Gray */
            --g50: #f9fafb;  --g100: #f3f4f6; --g200: #e5e7eb; --g300: #d1d5db;
            --g400: #9ca3af; --g500: #6b7280; --g600: #4b5563; --g700: #374151;
            --g800: #1f2937; --g900: #111827;
            /* Semantic */
            --red50: #fef2f2; --red: #ef4444; --red700: #b91c1c;
            --green50: #f0fdf4; --green: #22c55e; --green700: #15803d;
            --amber50: #fffbeb; --amber: #f59e0b; --amber700: #b45309;
            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 1px 3px rgba(0,0,0,0.04);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.07), 0 2px 6px rgba(0,0,0,0.04);
            --shadow-primary: 0 4px 14px rgba(59,130,246,0.25);
            /* Radii */
            --radius-sm: 10px;
            --radius: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-full: 999px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Inter', -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(180deg, var(--p50) 0%, #fff 60%);
            color: var(--g900); min-height: 100vh;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
        }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

        /* ---- Pages ---- */
        .page { display: none; min-height: 100vh; flex-direction: column; }
        .page.active { display: flex; animation: fadeIn 0.25s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

        /* ---- Header ---- */
        .nav-header {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; background: rgba(255,255,255,0.92);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--g200);
            position: sticky; top: 0; z-index: 10;
        }
        .nav-header h1 { font-size: 17px; font-weight: 600; flex: 1; text-align: center; color: var(--g900); }
        .nav-back {
            color: var(--g500); font-size: 15px; font-weight: 500;
            background: none; border: none; cursor: pointer;
            padding: 6px 10px; border-radius: var(--radius); transition: all 0.15s ease;
        }
        .nav-back:hover { background: var(--g100); color: var(--g700); }
        .nav-spacer { width: 28px; }

        /* ---- Home ---- */
        .home-header { text-align: center; padding: 48px 16px 24px; }
        .home-header h1 {
            font-size: 34px; font-weight: 700; color: var(--p700);
            letter-spacing: -0.5px; line-height: 1.2;
        }
        .home-header p { color: var(--g500); font-size: 14px; margin-top: 8px; font-weight: 400; }
        .home-cards { display: flex; flex-direction: column; gap: 12px; padding: 0 20px 24px; align-items: center; }
        .entry-card {
            width: 100%; max-width: 380px; display: flex; align-items: center; gap: 16px;
            background: #fff; border-radius: var(--radius-lg); padding: 18px 22px;
            box-shadow: var(--shadow); border: 1px solid var(--g100);
            cursor: pointer; transition: all 0.18s ease; user-select: none;
        }
        .entry-card:hover { border-color: var(--g200); box-shadow: var(--shadow-md); }
        .entry-card:active { transform: scale(0.975); background: var(--g50); }
        .entry-card .icon { font-size: 34px; width: 50px; height: 50px; text-align: center; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            background: var(--g50); border-radius: var(--radius); }
        .entry-card .title { font-size: 17px; font-weight: 600; color: var(--g900); line-height: 1.3; }
        .entry-card .sub { font-size: 12px; color: var(--g400); margin-top: 2px; }
        .entry-card.primary {
            background: linear-gradient(135deg, var(--p600), var(--p500));
            color: #fff; border: none; box-shadow: var(--shadow-primary);
            padding: 22px 24px;
        }
        .entry-card.primary .icon { background: rgba(255,255,255,0.15); color: #fff; }
        .entry-card.primary .title { color: #fff; font-size: 18px; }
        .entry-card.primary .sub { color: rgba(255,255,255,0.75); }
        .entry-card.primary:hover { box-shadow: 0 6px 20px rgba(37,99,235,0.35); }
        .home-scope {
            width: 100%; max-width: 380px; margin: 0 auto 8px;
            background: #fff; border-radius: var(--radius-lg);
            border: 1px solid var(--g100); padding: 18px 20px;
            box-shadow: var(--shadow-sm);
        }
        .scope-title { font-size: 14px; font-weight: 600; color: var(--g700); margin-bottom: 12px; }
        .scope-group { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
        .scope-shape {
            font-size: 12px; font-weight: 700; color: var(--p600);
            background: var(--p50); padding: 4px 10px; border-radius: var(--radius-full);
            white-space: nowrap; flex-shrink: 0; min-width: 64px; text-align: center;
        }
        .scope-tags { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
        .scope-tags span {
            font-size: 12px; color: var(--g500); background: var(--g50);
            padding: 3px 10px; border-radius: var(--radius-full);
            border: 1px solid var(--g100);
        }
        .scope-note { font-size: 12px; color: var(--g400); margin-top: 6px; text-align: center; }
        .home-footer { text-align: center; padding: 16px 0 36px; color: var(--g300); font-size: 11px; letter-spacing: 0.3px; }

        /* ---- Capture ---- */
        .capture-preview {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: #0f172a;
            background-image: radial-gradient(ellipse at center, #1e293b 0%, #0f172a 70%);
        }
        .capture-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .capture-empty { text-align: center; color: var(--g400); }
        .capture-empty .icon { font-size: 72px; margin-bottom: 16px; opacity: 0.7; }
        .capture-empty p { font-size: 14px; color: var(--g500); }
        .capture-actions {
            display: flex; gap: 12px; padding: 16px 20px 20px;
            background: rgba(15,23,42,0.95); backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 22px; border-radius: var(--radius); font-size: 15px; font-weight: 600;
            font-family: inherit; cursor: pointer; border: none; transition: all 0.18s ease;
            line-height: 1; letter-spacing: 0.1px;
        }
        .btn:active:not(:disabled) { transform: scale(0.965); }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-primary { flex: 1; background: var(--p500); color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.25); }
        .btn-primary:hover:not(:disabled) { background: var(--p600); box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
        .btn-outline {
            background: rgba(255,255,255,0.1); color: #fff; flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.15); min-width: 48px;
        }
        .btn-outline:hover:not(:disabled) { background: rgba(255,255,255,0.18); }
        .btn-full { width: 100%; background: var(--p500); color: #fff; box-shadow: 0 2px 8px rgba(59,130,246,0.25); }
        .btn-full:hover:not(:disabled) { background: var(--p600); box-shadow: 0 4px 14px rgba(37,99,235,0.35); }
        .btn-white { background: #fff; color: var(--g900); border: 1px solid var(--g200); box-shadow: var(--shadow-sm); }
        .btn-white:hover:not(:disabled) { border-color: var(--g300); box-shadow: var(--shadow); }

        /* ---- Text Input ---- */
        .confirm-body { flex: 1; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
        .confirm-body textarea {
            width: 100%; flex: 1; min-height: 200px; border: 1.5px solid var(--g200); border-radius: var(--radius);
            padding: 16px; font-size: 15px; font-family: inherit; line-height: 1.75; resize: none;
            color: var(--g900); transition: all 0.2s ease; background: #fff;
            box-shadow: var(--shadow-sm);
        }
        .confirm-body textarea:focus {
            outline: none; border-color: var(--p400); box-shadow: 0 0 0 3px rgba(96,165,250,0.15);
        }
        .hint {
            background: var(--p50); border-radius: var(--radius); padding: 14px 18px;
            font-size: 13px; color: var(--p700); line-height: 1.6;
            border-left: 3px solid var(--p300);
        }
        .status-msg {
            text-align: center; padding: 12px 16px; font-size: 13px; font-weight: 500;
            border-radius: var(--radius-full); display: none; margin: 0 16px;
        }
        .status-msg.show { display: block; animation: fadeIn 0.2s ease; }
        .status-msg.loading { background: var(--p50); color: var(--p700); }
        .status-msg.error { background: var(--red50); color: var(--red700); }
        .status-msg.success { background: var(--green50); color: var(--green700); }

        /* ---- History ---- */
        .history-list { flex: 1; overflow-y: auto; padding: 12px 16px 24px; }
        .history-item {
            display: flex; align-items: center; gap: 14px;
            background: #fff; border-radius: var(--radius-lg); border: 1px solid var(--g100);
            padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
            transition: all 0.15s ease; box-shadow: var(--shadow-sm);
        }
        .history-item:hover { border-color: var(--g200); box-shadow: var(--shadow); }
        .history-item:active { background: var(--g50); transform: scale(0.985); }
        .history-thumb {
            width: 52px; height: 52px; border-radius: var(--radius); background: var(--g50);
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0; overflow: hidden;
            border: 1px solid var(--g100);
        }
        .history-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .history-info { flex: 1; min-width: 0; }
        .history-info .text {
            font-size: 14px; font-weight: 500; line-height: 1.4; color: var(--g900);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .history-info .answer {
            display: inline-block; font-size: 11px; font-weight: 600; color: var(--green700);
            background: var(--green50); padding: 2px 10px; border-radius: var(--radius-full);
            margin-top: 4px;
        }
        .history-info .time { font-size: 11px; color: var(--g400); margin-top: 3px; }
        .history-delete {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: transparent; color: var(--g300); font-size: 20px;
            cursor: pointer; flex-shrink: 0; line-height: 1;
            transition: all 0.15s ease; display: flex; align-items: center; justify-content: center;
        }
        .history-delete:hover { background: var(--red50); color: var(--red); }
        .history-clear {
            background: none; border: none; color: var(--g400); font-size: 13px; font-weight: 500;
            cursor: pointer; padding: 6px 10px; flex-shrink: 0; border-radius: var(--radius);
            transition: all 0.15s ease;
        }
        .history-clear:hover { background: var(--red50); color: var(--red); }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--g400); }
        .empty-state .icon { font-size: 64px; margin-bottom: 16px; opacity: 0.6; }
        .empty-state p { font-size: 15px; color: var(--g500); }

        /* ---- Spinner ---- */
        .spinner {
            display: inline-block; border: 2.5px solid rgba(255,255,255,0.25);
            border-top-color: #fff; border-radius: 50%;
            width: 20px; height: 20px; animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ---- Responsive ---- */
        @media (max-width: 480px) {
            .home-header { padding: 36px 16px 18px; }
            .home-header h1 { font-size: 28px; }
            .home-header p { font-size: 13px; }
            .entry-card { padding: 16px 18px; max-width: 100%; }
            .entry-card.primary { padding: 18px 20px; }
            .entry-card .icon { font-size: 30px; width: 44px; height: 44px; }
            .confirm-body { padding: 16px 12px; }
            .confirm-body textarea { min-height: 160px; font-size: 16px; }
            .capture-actions { padding: 12px 14px 16px; }
            .btn { padding: 13px 18px; font-size: 14px; }
        }
    </style>
</head>
<body>

<!-- ========== Home ========== -->
<div class="page active safe-bottom" id="page-home">
    <div class="home-header">
        <h1>Math3D</h1>
        <p>拍照搜题 · AI 解析 · 交互式 3D 课件</p>
    </div>
    <div class="home-cards">
        <div class="entry-card primary" data-nav="capture">
            <span class="icon">📷</span>
            <div><div class="title">拍照搜题</div><div class="sub">拍摄题目照片，AI 自动识别</div></div>
        </div>
        <div class="entry-card" data-nav="capture-album">
            <span class="icon">🖼️</span>
            <div><div class="title">从相册选择</div><div class="sub">上传已有的题目截图</div></div>
        </div>
        <div class="entry-card" data-nav="text">
            <span class="icon">⌨️</span>
            <div><div class="title">文字输入</div><div class="sub">手动输入题目内容</div></div>
        </div>
        <div class="entry-card" data-nav="history">
            <span class="icon">📋</span>
            <div><div class="title">历史记录</div><div class="sub">查看已解答的题目</div></div>
        </div>
    </div>
    <div class="home-scope">
        <div class="scope-title">📐 当前支持题型</div>
        <div class="scope-group">
            <div class="scope-shape">正方体</div>
            <div class="scope-tags">
                <span>线面角</span><span>异面直线夹角</span><span>点面距离</span><span>动点取值范围</span>
            </div>
        </div>
        <div class="scope-group">
            <div class="scope-shape">正四棱锥</div>
            <div class="scope-tags">
                <span>线面角</span>
            </div>
        </div>
        <p class="scope-note">也可输入「随机」试试随机出题 ✨</p>
    </div>
    <div class="home-footer">Math3D v0.3.0</div>
</div>

<!-- ========== Camera / Album Capture ========== -->
<div class="page safe-bottom" id="page-capture">
    <div class="nav-header">
        <button class="nav-back" data-back>← 返回</button>
        <h1 id="capture-title">拍照搜题</h1>
        <div class="nav-spacer"></div>
    </div>
    <div class="capture-preview" id="capture-preview">
        <div class="capture-empty" id="capture-empty">
            <div class="icon">📷</div>
            <p>点击下方按钮拍摄题目照片</p>
        </div>
        <img id="capture-img" src="" alt="" style="display:none">
    </div>
    <div id="capture-status" class="status-msg"></div>
    <div class="capture-actions" id="capture-actions-camera">
        <button class="btn btn-primary" id="btn-capture-take">📷 拍照</button>
        <button class="btn btn-outline" id="btn-capture-album-btn">🖼️</button>
    </div>
    <div class="capture-actions" id="capture-actions-album" style="display:none">
        <button class="btn btn-primary" id="btn-capture-album-full">🖼️ 从相册选择</button>
    </div>
    <input type="file" id="capture-file" accept="image/*" capture="environment" style="display:none">
    <input type="file" id="album-file" accept="image/*" style="display:none">
</div>

<!-- ========== Text Input ========== -->
<div class="page safe-bottom" id="page-text">
    <div class="nav-header">
        <button class="nav-back" data-back>← 返回</button>
        <h1>文字输入题目</h1>
        <div class="nav-spacer"></div>
    </div>
    <div id="text-status" class="status-msg"></div>
    <div class="confirm-body">
        <textarea id="text-input" placeholder="请输入题目内容，例如：&#10;在正方体 ABCD-A1B1C1D1 中，棱长为 2，求直线 AB1 与平面 A1C1D 的夹角。"></textarea>
        <button class="btn btn-full" id="btn-text-submit">提交题目</button>
    </div>
</div>

<!-- ========== History ========== -->
<div class="page safe-bottom" id="page-history">
    <div class="nav-header">
        <button class="nav-back" data-back>← 返回</button>
        <h1>历史记录</h1>
        <button class="history-clear" id="btn-clear-history">清空</button>
    </div>
    <div class="history-list" id="history-list">
        <div class="empty-state" id="history-empty">
            <div class="icon">📭</div>
            <p>暂无记录</p>
        </div>
    </div>
</div>

<script>
// ===== Page Router =====
const pages = {};
document.querySelectorAll('.page').forEach(p => pages[p.id.replace('page-','')] = p);

function navigate(name) {
    if (window.location.hash === '#' + name) return; // prevent hashchange recursion
    Object.values(pages).forEach(p => p.classList.remove('active'));
    const target = pages[name];
    if (target) target.classList.add('active');
    window.location.hash = name;
    window.scrollTo(0, 0);
}

// Back buttons
document.querySelectorAll('[data-back]').forEach(btn => {
    btn.addEventListener('click', () => {
        const activePage = document.querySelector('.page.active');
        // Reset state based on which page we're leaving
        if (activePage && activePage.id === 'page-capture') {
            resetCapture('camera');
        }
        if (activePage && activePage.id === 'page-text') {
            document.getElementById('text-input').value = '';
            $textStatus.className = 'status-msg';
        }
        navigate('home');
    });
});

// Home cards
document.querySelectorAll('[data-nav]').forEach(card => {
    card.addEventListener('click', () => {
        const nav = card.dataset.nav;
        if (nav === 'capture') { resetCapture('camera'); navigate('capture'); }
        else if (nav === 'capture-album') { resetCapture('album'); navigate('capture'); }
        else if (nav === 'text') {
            // Clear stale OCR text when entering text page directly
            document.getElementById('text-input').value = '';
            $textStatus.className = 'status-msg';
            navigate('text');
        }
        else navigate(nav);
    });
});

// ===== Capture =====
const $captureEmpty = document.getElementById('capture-empty');
const $captureImg = document.getElementById('capture-img');
const $captureStatus = document.getElementById('capture-status');
const $captureTitle = document.getElementById('capture-title');
const $captureFile = document.getElementById('capture-file');
const $albumFile = document.getElementById('album-file');

const $actionsCamera = document.getElementById('capture-actions-camera');
const $actionsAlbum = document.getElementById('capture-actions-album');

function resetCapture(mode) {
    $captureTitle.textContent = mode === 'album' ? '从相册选择' : '拍照搜题';
    $captureImg.style.display = 'none';
    $captureEmpty.style.display = '';
    $captureStatus.className = 'status-msg';
    $captureFile.value = '';
    $albumFile.value = '';
    // Toggle button groups
    $actionsCamera.style.display = mode === 'album' ? 'none' : '';
    $actionsAlbum.style.display = mode === 'album' ? '' : 'none';
}

let _captureObjUrl = null;
function showCapturePreview(file) {
    if (_captureObjUrl) URL.revokeObjectURL(_captureObjUrl);
    _captureObjUrl = URL.createObjectURL(file);
    $captureImg.src = _captureObjUrl;
    $captureImg.style.display = '';
    $captureEmpty.style.display = 'none';
}

function captureStatus(msg, type) {
    $captureStatus.textContent = msg;
    $captureStatus.className = 'status-msg ' + type + ' show';
}

document.getElementById('btn-capture-take').addEventListener('click', () => $captureFile.click());
document.getElementById('btn-capture-album-btn').addEventListener('click', () => $albumFile.click());
document.getElementById('btn-capture-album-full').addEventListener('click', () => $albumFile.click());

// Compress image before upload: resize to max 1920px, convert to JPEG
// Fixes: (1) HEIC→JPEG for iPhone photos, (2) reduces file size from MB→~200KB
function compressImage(file) {
    return new Promise((resolve, reject) => {
        // If already a small JPEG, skip compression
        if (file.type === 'image/jpeg' && file.size < 300 * 1024) {
            resolve(file);
            return;
        }
        const img = new Image();
        const objUrl = URL.createObjectURL(file);
        img.onload = () => {
            URL.revokeObjectURL(objUrl);
            const maxDim = 1920;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
                const scale = maxDim / Math.max(w, h);
                w = Math.round(w * scale);
                h = Math.round(h * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            canvas.toBlob(blob => {
                if (blob) resolve(new File([blob], 'photo.jpg', { type: 'image/jpeg' }));
                else reject(new Error('compress failed'));
            }, 'image/jpeg', 0.85);
        };
        img.onerror = () => { URL.revokeObjectURL(objUrl); reject(new Error('image load failed')); };
        img.src = objUrl;
    });
}

async function handleCaptureFile(file) {
    if (!file) return;
    showCapturePreview(file);
    captureStatus('正在压缩图片...', 'loading');

    try {
        // Compress before upload (convert HEIC → JPEG, resize large photos)
        const compressed = await compressImage(file);
        captureStatus('正在调用视觉 AI 识别...', 'loading');

        const fd = new FormData(); fd.append('image', compressed, compressed.name);
        const res = await fetch('/api/ocr', { method: 'POST', body: fd });
        if (!res.ok) {
            const errText = await res.text().catch(() => '');
            throw new Error('OCR 请求失败 (' + res.status + ')' + (errText ? ': ' + errText.slice(0, 100) : ''));
        }
        const data = await res.json();

        if (!data.success) {
            captureStatus('识别失败：' + (data.error || '请确认 LLM 已配置'), 'error');
            return;
        }
        const text = (data.text || '').trim();
        if (!text) { captureStatus('未识别到文字，请重新拍照', 'error'); return; }

        captureStatus('识别完成', 'success');
        // Navigate to text page for user review & confirmation
        document.getElementById('text-input').value = text;
        $textStatus.textContent = '✅ 识别完成，请核对题目后提交';
        $textStatus.className = 'status-msg success show';
        setTimeout(() => navigate('text'), 500);
    } catch (e) {
        captureStatus('错误：' + (e.message || '请重试'), 'error');
    }
}

$captureFile.addEventListener('change', e => handleCaptureFile(e.target.files[0]));
$albumFile.addEventListener('change', e => handleCaptureFile(e.target.files[0]));

// ===== Text Input =====
const $textStatus = document.getElementById('text-status');

document.getElementById('btn-text-submit').addEventListener('click', async () => {
    const text = document.getElementById('text-input').value.trim();
    if (!text) return;
    $textStatus.textContent = '正在提交...'; $textStatus.className = 'status-msg loading show';
    await submitAndGo(text, $textStatus);
});

// ===== Shared: submit & redirect =====
async function submitAndGo(text, $statusEl) {
    if (!text) return;
    $statusEl.textContent = '正在解析计算...'; $statusEl.className = 'status-msg loading show';

    try {
        const res = await fetch('/api/solve', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ problem: text }),
        });
        if (!res.ok) {
            const errText = await res.text().catch(() => '');
            throw new Error('求解请求失败 (' + res.status + ')' + (errText ? ': ' + errText.slice(0, 100) : ''));
        }
        const data = await res.json();
        if (!data.success) throw new Error(data.error || '求解失败');

        // Save to history
        saveHistory(text, data.answer_latex, data.answer_value);

        const url = URL.createObjectURL(new Blob([data.html], { type: 'text/html' }));
        const win = window.open(url, '_blank');
        // Revoke blob URL after the new tab has loaded
        if (win) { setTimeout(() => URL.revokeObjectURL(url), 10000); }
        else { $statusEl.textContent = '请允许弹出窗口以查看解题页'; $statusEl.className = 'status-msg error show'; }
    } catch (e) {
        $statusEl.textContent = '错误：' + e.message; $statusEl.className = 'status-msg error show';
    }
}

// ===== History =====
const HISTORY_KEY = 'math3d_history';

function loadHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
    catch { return []; }
}

function saveHistory(problem, answer_latex, answer_value) {
    const items = loadHistory();
    items.unshift({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
        problem: problem.slice(0, 80),
        answer_latex,
        answer_value,
        time: Date.now(),
    });
    // Keep max 50
    if (items.length > 50) items.length = 50;
    localStorage.setItem(HISTORY_KEY, JSON.stringify(items));
}

function formatTime(ts) {
    const d = new Date(ts);
    return d.getFullYear() + '-' +
        String(d.getMonth()+1).padStart(2,'0') + '-' +
        String(d.getDate()).padStart(2,'0') + ' ' +
        String(d.getHours()).padStart(2,'0') + ':' +
        String(d.getMinutes()).padStart(2,'0');
}

function renderHistory() {
    const items = loadHistory();
    const list = document.getElementById('history-list');
    const empty = document.getElementById('history-empty');

    if (items.length === 0) {
        empty.style.display = '';
        list.querySelectorAll('.history-item').forEach(el => el.remove());
        return;
    }
    empty.style.display = 'none';

    // Remove old items not in current list
    list.querySelectorAll('.history-item').forEach(el => {
        if (!items.find(i => i.id === el.dataset.id)) el.remove();
    });

    items.forEach(item => {
        if (list.querySelector(`[data-id="${item.id}"]`)) return; // already rendered
        const div = document.createElement('div');
        div.className = 'history-item';
        div.dataset.id = item.id;
        div.innerHTML = `
            <div class="history-thumb">📐</div>
            <div class="history-info">
                <div class="text">${escapeHtml(item.problem)}</div>
                <div class="answer">答案：${escapeHtml(item.answer_latex || '')}</div>
                <div class="time">${formatTime(item.time)}</div>
            </div>
            <button class="history-delete" data-id="${item.id}">×</button>
        `;
        div.addEventListener('click', (e) => {
            // Don't navigate if clicking delete button
            if (e.target.closest('.history-delete')) return;
            document.getElementById('text-input').value = item.problem;
            navigate('text');
        });
        list.insertBefore(div, list.firstChild);
    });
}

function escapeHtml(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
}

function deleteHistoryItem(id) {
    const items = loadHistory().filter(i => i.id !== id);
    localStorage.setItem(HISTORY_KEY, JSON.stringify(items));
    renderHistory();
}

function clearHistory() {
    if (confirm('确定要清除所有历史记录吗？')) {
        localStorage.removeItem(HISTORY_KEY);
        renderHistory();
    }
}

// Delegate click for dynamic history items (delete buttons)
document.getElementById('history-list').addEventListener('click', (e) => {
    const btn = e.target.closest('.history-delete');
    if (btn) {
        e.stopPropagation();
        e.stopImmediatePropagation();
        deleteHistoryItem(btn.dataset.id);
    }
});

// Clear-history button
document.getElementById('btn-clear-history').addEventListener('click', clearHistory);

// ===== Init =====
function init() {
    const hash = window.location.hash.replace('#','');
    if (hash && pages[hash]) navigate(hash);

    // Browser back/forward support
    window.addEventListener('hashchange', () => {
        const name = window.location.hash.replace('#', '');
        if (name && pages[name]) {
            // Update page visibility without re-setting hash
            Object.values(pages).forEach(p => p.classList.remove('active'));
            if (pages[name]) pages[name].classList.add('active');
            window.scrollTo(0, 0);
        }
    });

    // Render history when shown
    const historyObserver = new MutationObserver(() => {
        if (pages.history.classList.contains('active')) renderHistory();
    });
    historyObserver.observe(pages.history, { attributes: true, attributeFilter: ['class'] });
}

init();
