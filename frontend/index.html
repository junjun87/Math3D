<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edulab — 立体几何交互解题</title>
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --accent: #d946ef;
            --bg: #edf3f8;
            --surface: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #e2e8f0;
            --shadow-soft: 0 18px 45px rgba(15,23,42,0.08);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg); color: var(--text);
        }
        .container { width: 100%; max-width: 540px; padding: 20px; }
        .header { text-align: center; margin-bottom: 32px; }
        .header h1 {
            font-size: 36px; font-weight: 800; margin: 0 0 8px;
            background: linear-gradient(135deg, var(--primary-dark), var(--accent));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--muted); font-size: 15px; margin: 0; }
        .card {
            background: var(--surface); border-radius: 20px; padding: 24px;
            border: 1px solid rgba(226,232,240,0.95);
            box-shadow: var(--shadow-soft);
        }
        .card label { display: block; font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
        .card textarea {
            width: 100%; border: 1px solid var(--border); border-radius: 12px;
            padding: 14px; font-size: 15px; font-family: inherit; line-height: 1.6;
            resize: vertical; color: var(--text); background: #f8fafc;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .card textarea:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(14,165,233,0.12);
        }
        .btn-row { display: flex; gap: 12px; margin-top: 16px; }
        .btn {
            padding: 12px 20px; border-radius: 10px; font-weight: 700;
            font-size: 15px; font-family: inherit; cursor: pointer; border: none;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-primary { flex: 1; background: var(--primary-dark); color: white; box-shadow: 0 4px 14px rgba(14,165,233,0.25); }
        .btn-primary:hover:not(:disabled) { box-shadow: 0 6px 20px rgba(14,165,233,0.35); }
        .btn-camera {
            background: #f1f5f9; color: var(--text);
            border: 1px solid var(--border); white-space: nowrap;
        }
        .btn-camera:hover { background: #e2e8f0; }
        .spinner {
            border: 2.5px solid rgba(255,255,255,0.3); border-top: 2.5px solid white;
            border-radius: 50%; width: 16px; height: 16px; animation: spin 0.7s linear infinite;
            display: inline-block; vertical-align: middle;
        }
        .spinner-dark {
            border-color: rgba(0,0,0,0.1); border-top-color: var(--primary-dark);
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        #status {
            margin-top: 16px; padding: 12px 16px; border-radius: 12px;
            font-size: 14px; text-align: center; display: none;
        }
        #status.error { display: block; background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
        #status.loading { display: block; background: #f0f9ff; color: #075985; border: 1px solid #bae6fd; }
        #status.success { display: block; background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }

        .photo-area {
            margin-top: 12px; display: none;
        }
        .photo-preview {
            position: relative; display: inline-block; border-radius: 10px;
            overflow: hidden; border: 1px solid var(--border);
        }
        .photo-preview img { display: block; max-height: 180px; max-width: 100%; }
        .photo-preview .ocr-overlay {
            position: absolute; inset: 0; background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 14px; font-weight: 600;
        }
        .photo-actions { display: flex; gap: 8px; margin-top: 8px; }
        .btn-sm {
            padding: 8px 14px; font-size: 13px; border-radius: 8px; font-weight: 600;
            font-family: inherit; cursor: pointer; border: none;
            background: #f1f5f9; color: var(--text);
            transition: background 0.15s;
        }
        .btn-sm:hover { background: #e2e8f0; }
        .btn-sm.danger { color: #dc2626; }
        .btn-sm.danger:hover { background: #fef2f2; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Edulab</h1>
        <p>拍照或输入立体几何题，生成可交互 3D 解题页</p>
    </div>
    <div class="card">
        <label>题目描述</label>
        <textarea id="problem-input" rows="4" placeholder="例如：正方体 ABCD-A1B1C1D1 棱长为 2，求直线 AC1 与平面 BDD1B1 所成角的正弦值。">正方体 ABCD-A1B1C1D1 棱长为 2，求直线 AC1 与平面 BDD1B1 所成角的正弦值。</textarea>

        <div class="photo-area" id="photo-area">
            <div class="photo-preview" id="photo-preview">
                <img id="photo-img" src="" alt="题目照片">
            </div>
            <div class="photo-actions">
                <button class="btn-sm danger" id="btn-retake">删除重拍</button>
            </div>
        </div>

        <div class="btn-row">
            <button id="btn-generate" class="btn btn-primary">生成解题页</button>
            <button id="btn-camera" class="btn btn-camera">📷 拍照识别</button>
        </div>
        <div id="status"></div>
    </div>
</div>

<!-- Hidden file input -->
<input type="file" id="file-input" accept="image/*" capture="environment" style="display:none">

<script>
    const API_BASE = '';
    const $status = document.getElementById('status');
    const $btn = document.getElementById('btn-generate');
    const $textarea = document.getElementById('problem-input');
    const $photoArea = document.getElementById('photo-area');
    const $photoImg = document.getElementById('photo-img');
    const $fileInput = document.getElementById('file-input');

    function setStatus(msg, type) {
        $status.textContent = msg;
        $status.className = type;
    }

    // ---- 拍照 / 上传 ----
    document.getElementById('btn-camera').addEventListener('click', () => {
        $fileInput.click();
    });

    $fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        $photoImg.src = URL.createObjectURL(file);
        $photoArea.style.display = 'block';
        $status.className = '';

        await runOCR(file);
    });

    document.getElementById('btn-retake').addEventListener('click', () => {
        $photoImg.src = '';
        $photoArea.style.display = 'none';
        $fileInput.value = '';
        $status.className = '';
    });

    // ---- OCR：上传图片到后端，由视觉 LLM 识别 ----
    async function runOCR(file) {
        setStatus('正在上传图片并调用视觉模型识别...', 'loading');

        try {
            const formData = new FormData();
            formData.append('image', file);

            const res = await fetch(`${API_BASE}/api/ocr`, {
                method: 'POST',
                body: formData,
            });
            const data = await res.json();

            if (!data.success) {
                // 503 = LLM 未配置
                if (res.status === 503) {
                    setStatus('视觉 LLM 未配置。请设置 LLM_API_KEY 环境变量，或手动输入题目。', 'error');
                } else {
                    setStatus('OCR 失败：' + (data.error || '未知错误'), 'error');
                }
                return;
            }

            const text = (data.text || '').trim();
            if (text) {
                $textarea.value = text;
                $textarea.focus();
                setStatus('识别完成，请核对后点击「生成解题页」', 'success');
            } else {
                setStatus('未识别到题目文字，请手动输入或重新拍照', 'error');
            }
        } catch (err) {
            console.error('OCR error:', err);
            setStatus('网络错误，请检查后端是否运行。或手动输入题目。', 'error');
        }
    }

    // ---- 生成解题页 ----
    document.getElementById('btn-generate').addEventListener('click', async () => {
        const input = $textarea.value.trim();
        if (!input) { alert('请输入题目'); return; }

        $btn.disabled = true;
        $btn.innerHTML = '<span class="spinner"></span> 生成中...';
        setStatus('正在解析并计算，请稍候...', 'loading');

        try {
            const res = await fetch(`${API_BASE}/api/solve`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ problem: input }),
            });
            const data = await res.json();
            if (!data.success) throw new Error(data.error || '生成失败');

            const url = URL.createObjectURL(new Blob([data.html], { type: 'text/html' }));
            window.location.href = url;
        } catch (err) {
            setStatus('错误：' + err.message, 'error');
            $btn.disabled = false;
            $btn.innerHTML = '生成解题页';
        }
    });
</script>
</body>
</html>
